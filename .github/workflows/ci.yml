name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: shipyard_ai_test
          POSTGRES_PASSWORD: shipyard_test
          POSTGRES_USER: shipyard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipyard_test -d shipyard_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    timeout-minutes: 10

    env:
      TEST_DATABASE_URL: >-
        postgresql+psycopg://shipyard_test:shipyard_test@127.0.0.1:5432/shipyard_ai_test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development dependencies
        run: make install-dev PYTHON=python

      - name: Run quality gates
        run: make check PYTHON=python
